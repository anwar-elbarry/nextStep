<div class="fixed top-4 right-4 z-50 max-w-md w-full space-y-3">
    @for (alert of alerts(); track alert.id) {
    <div [class]="getAlertClasses(alert.type)" role="alert" class="animate-slide-in-right shadow-lg">
        <svg class="w-5 h-5 mr-2 flex-shrink-0" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path [attr.d]="getAlertIcon(alert.type).path" [attr.stroke]="getAlertIcon(alert.type).stroke"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>

        <div class="flex-1">
            <span class="font-semibold mr-1">{{ getAlertLabel(alert.type) }}</span>
            {{ alert.message }}
        </div>

        <button (click)="dismiss(alert.id)" class="ml-3 text-current opacity-50 hover:opacity-100 transition-opacity"
            aria-label="Dismiss alert">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                    d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                    clip-rule="evenodd"></path>
            </svg>
        </button>
    </div>
    }
</div>
