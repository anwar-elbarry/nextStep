<div class="pt-20 pb-16">

    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">

      <!-- Job Header Card -->
      <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100 mb-8">

        <!-- Top accent bar -->
        <div class="h-2 bg-gradient-to-r from-blue-500 to-indigo-600"></div>

        <div class="p-6 sm:p-8">

          <!-- Title & Company -->
          <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4 mb-6">
            <div>
              <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">
                <!-- jobTitle -->
                {{job?.jobTitle}}
              </h1>
              <div class="mt-2 flex items-center text-lg text-gray-700">
                <!-- companyName -->
                <span>{{job?.companyName}}</span>
                <span class="mx-3 text-gray-400">•</span>
                <!-- location -->
                <span class="flex items-center">
                  <svg class="w-5 h-5 mr-1.5 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
                  </svg>
                 {{job?.location}}
                </span>
              </div>
            </div>

            <!-- Favorite button -->
            <button class="flex items-center justify-center w-12 h-12 rounded-full bg-gray-100 hover:bg-gray-200 transition text-gray-600 hover:text-red-500 focus:outline-none focus:ring-2 focus:ring-red-300"
                    title="Add to favorites">
              <!-- Heart icon (outline when not favorited, solid when favorited) -->
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
              </svg>
            </button>
          </div>

          <!-- Metadata chips -->
          <div class="flex flex-wrap gap-3 mb-8">
            <div class="inline-flex items-center px-4 py-2 bg-blue-50 text-blue-700 rounded-full text-sm font-medium">
              <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/>
              </svg>
              <!-- publicationDate -->
              {{job?.publicationDate}}
            </div>

            <!-- salary (optional) -->
            <div class="inline-flex items-center px-4 py-2 bg-green-50 text-green-700 rounded-full text-sm font-medium">
              <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path d="M8.433 7.418c.155-.103.346-.196.567-.267v1.698a2.305 2.305 0 01-.567-.267C8.07 8.34 8 8.114 8 8c0-.114.07-.34.433-.582zM11 12.849v-1.698c.269.165.597.278.933.267.354-.01.696-.1.933-.267.364-.242.433-.468.433-.582 0-.114-.07-.34-.433-.582a2.305 2.305 0 00-.567-.267v1.698c.269.165.597.278.933.267z"/>
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.5 8c0-.828.448-1.5 1-1.5s1 .672 1 1.5-.448 1.5-1 1.5-1-.672-1-1.5z" clip-rule="evenodd"/>
              </svg>
              {{job?.salary}}
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex flex-col sm:flex-row gap-4 mb-10">
            <a routerLink="/applications"
               class="flex-1 inline-flex justify-center items-center px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-lg rounded-xl shadow-md transition focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
              Apply Now
            </a>
            <a 
               [href]="job?.fullOfferLink"
               target="_blank"
               class="flex-1 inline-flex justify-center items-center px-8 py-4 border-2 border-blue-600 text-blue-600 hover:bg-blue-50 font-semibold text-lg rounded-xl transition">
              View Full Offer →
            </a>
          </div>

        </div>
      </div>

      <!-- Job Description Section -->
      <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 sm:p-8">

        <h2 class="text-2xl font-bold text-gray-900 mb-6">Job Description</h2>

        <!-- Full description -->
        <div class="prose prose-slate max-w-none text-gray-700" [innerHTML]="job?.description">

      </div>

    </div>
  </div>
