<div class="flex items-center w-full max-w-3xl bg-[#f1f3f4] rounded-full px-2 py-1 shadow-sm border border-transparent focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-100 transition-all">
      
      <div class="flex items-center flex-1 px-4 border-r border-gray-300">
        <span class="text-gray-400 mr-2">🔍</span>
        <input 
          #searchInput
          type="text" 
          [placeholder]="placeholder()"
          class="w-full bg-transparent border-none outline-none text-gray-700 py-2"
          (keyup.enter)="triggerSearch(searchInput.value)"
        />
      </div>

      <div class="flex items-center px-4 min-w-[140px]">
        <span class="text-gray-400 mr-2">📍</span>
        <select 
          #countrySelect
          class="bg-transparent border-none outline-none text-gray-600 cursor-pointer appearance-none flex-1"
          (change)="onCountryChange(countrySelect.value)"
        >
          @for (c of countries(); track c.code) {
            <option [value]="c.code">{{ c.name }}</option>
          }
        </select>
      </div>

      <button 
        (click)="triggerSearch(searchInput.value)"
        class="bg-blue-600 text-white px-6 py-2 rounded-full hover:bg-blue-700 transition-colors ml-2"
      >
        Search
      </button>
    </div>
