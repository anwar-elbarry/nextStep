<div class="w-full max-w-4xl mx-auto">
  <div
    class="flex items-center bg-white rounded-full shadow-lg hover:shadow-xl transition-all duration-300 border-2 border-transparent focus-within:border-blue-400 focus-within:shadow-2xl p-2">

    <!-- Search Input Section -->
    <div class="flex items-center flex-1 px-4 gap-3">
      <i class="fas fa-search text-gray-400 text-lg transition-colors duration-200"></i>
      <input #searchInput type="text" [placeholder]="placeholder()"
        class="w-full bg-transparent border-none outline-none text-gray-700 placeholder-gray-400 text-base py-3 focus:placeholder-gray-300"
        (keyup.enter)="triggerSearch(searchInput.value)" />
    </div>

    <!-- Divider -->
    <div class="h-10 w-px bg-gradient-to-b from-transparent via-gray-300 to-transparent mx-2"></div>

    <!-- Location Select Section -->
    <div class="flex items-center px-4 gap-3 min-w-[160px] relative">
      <i class="fas fa-map-marker-alt text-gray-400 text-lg transition-colors duration-200"></i>
      <select #countrySelect
        class="flex-1 bg-transparent border-none outline-none text-gray-600 font-medium text-sm cursor-pointer appearance-none pr-6 py-3 focus:text-gray-900"
        (change)="onCountryChange(countrySelect.value)">
        @for (c of countries(); track c.code) {
        <option [value]="c.code">{{ c.name }}</option>
        }
      </select>
      <i
        class="fas fa-chevron-down text-gray-400 text-xs absolute right-4 pointer-events-none transition-transform duration-200"></i>
    </div>

    <!-- Search Button -->
    <button (click)="triggerSearch(searchInput.value)"
      class="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white px-8 py-3.5 rounded-full font-semibold text-base shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 ml-2"
      aria-label="Search jobs">
      <i class="fas fa-search text-base"></i>
      <span>Search</span>
    </button>

  </div>
</div>
