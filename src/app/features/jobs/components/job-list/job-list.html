<div class="h-full flex flex-col bg-white">
  <!-- Header Section -->
  <div class="p-6 border-b border-gray-200">
    <h2 class="text-2xl font-bold text-gray-900 mb-4">My Jobs</h2>

    <!-- Tabs -->
    <div class="flex gap-4 mb-4">
      <button class="px-4 py-2 text-sm font-medium text-white bg-orange-500 rounded-lg hover:bg-orange-600 transition">
        All Jobs
      </button>
      <button
        class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition">
        Saved Jobs
      </button>
      <button
        class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition">
        Jobs Applied
      </button>
    </div>

    <!-- Job Count and Sort -->
    <div class="flex items-center justify-between">
      <p class="text-sm text-gray-600">
        <span class="font-semibold text-gray-900">{{totalJobs()}}</span> Jobs
      </p>
      <div class="flex items-center gap-2">
        <span class="text-sm text-gray-600">Sort by</span>
        <select
          class="text-sm border border-gray-300 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-orange-500">
          <option>Newest Post</option>
          <option>Oldest Post</option>
          <option>Salary: High to Low</option>
          <option>Salary: Low to High</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  @if (loading()) {
  <div class="flex-1 flex items-center justify-center p-8">
    <div class="text-center">
      <div class="w-12 h-12 border-4 border-orange-200 border-t-orange-500 rounded-full animate-spin mx-auto mb-4">
      </div>
      <p class="text-gray-600">Loading jobs...</p>
    </div>
  </div>
  }

  <!-- Error State -->
  @else if (error()) {
  <div class="flex-1 flex items-center justify-center p-8">
    <div class="text-center">
      <svg class="w-16 h-16 text-red-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <h3 class="text-lg font-semibold text-gray-800 mb-2">Error loading jobs</h3>
      <p class="text-gray-600 mb-4">{{ error() }}</p>
      <button (click)="getJobs()" class="px-6 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition">
        Try Again
      </button>
    </div>
  </div>
  }

  <!-- Jobs List -->
  @else {
  <div class="flex-1 overflow-y-auto p-6 space-y-4">
    @for (job of jobsList(); track job.id) {
    <app-job-card [job]="job" [country]="country()" [page]="page()" (click)="handleJobClick(job)"
      class="cursor-pointer block" />
    }

    <!-- Empty State -->
    @empty {
    <div class="flex flex-col items-center justify-center min-h-[300px] text-center">
      <svg class="w-20 h-20 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <h3 class="text-lg font-semibold text-gray-700 mb-2">No jobs found</h3>
      <p class="text-gray-500">Try adjusting your search criteria</p>
    </div>
    }
  </div>

  <!-- Pagination -->
  @if (jobsList().length > 0) {
  <div class="border-t border-gray-200 p-4">
    <app-pagination [currentPage]="page()" [totalPages]="totalPages()" [totalElements]="totalJobs()"
      (pageChange)="pageChange.emit($event)" />
  </div>
  }
  }
</div>
