<div class="flex flex-col h-screen bg-gray-50">
    <!-- Search Filter -->
    <div class="px-6 p-2">
        <app-search-filter-job [countries]="countries()" (onSearch)="handleSearch($event)" />
    </div>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Left Panel - Job List -->
        <div class="w-full lg:w-2/5 border-r border-gray-200 bg-white overflow-y-auto">
            <app-job-list [country]="country()" [searchQuery]="searchQuery()" [page]="page()"
                (jobSelected)="handleJobSelect($event)" (stateUpdate)="handleStateUpdate($event)"
                (pageChange)="handlePageChange($event)" />
        </div>

        <!-- Right Panel - Job Details -->
        <div class="hidden lg:block lg:w-3/5 overflow-y-auto">
            @if (selectedJob()) {
            <app-job-details [job]="selectedJob()" />
            } @else {
            <!-- Empty State -->
            <div class="flex flex-col items-center justify-center h-full text-center px-8">
                <svg class="w-32 h-32 text-gray-300 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                <h3 class="text-2xl font-semibold text-gray-700 mb-2">Select a Job</h3>
                <p class="text-gray-500 max-w-md">
                    Click on any job from the list to view its details here
                </p>
            </div>
            }
        </div>
    </div>
</div>
