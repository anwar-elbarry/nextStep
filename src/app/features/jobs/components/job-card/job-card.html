<div (click)="getJobDetails(job()?.id || 'not-found')"
  class="bg-white border border-gray-200 rounded-lg p-6 hover:shadow-lg transition-shadow duration-200 cursor-pointer relative w-full min-h-[200px] flex flex-col">
  <!-- Bookmark Icon -->
  @if (isauthenticated()) {
  @if (isFavorite()) {
  <!-- Already in favorites - show filled red bookmark -->
  <button (click)="removeFromFavorites(job()!); $event.stopPropagation()"
    class="absolute top-5 right-5 p-2 rounded-full text-red-500 hover:text-red-600 hover:bg-gray-100 transition-all duration-200"
    aria-label="Remove from favorites">
   <i class="fas fa-heart" style="color: red;"></i>
  </button>
  } @else {
  <!-- Not in favorites - show outline gray bookmark -->
  <button (click)="addToFavorites(job()!); $event.stopPropagation()"
    class="absolute top-5 right-5 p-2 rounded-full text-gray-400 hover:text-green-500 hover:bg-gray-100 transition-all duration-200"
    aria-label="Add to favorites">
    <i class="fas fa-heart" style="color: gray;"></i>
  </button>
  }
  }


  <!-- Company Name -->
  <h3 class="text-base font-semibold text-gray-900 mb-2 pr-8">{{ job()?.companyName }}</h3>

  <!-- Job Title -->
  <h4 class="text-xl font-bold text-gray-900 mb-3 leading-tight">{{ job()?.jobTitle }}</h4>

  <!-- Location -->
  <p class="text-sm text-gray-600 mb-3">{{ job()?.location }}</p>
  <!-- Posted Date -->
  <p class="text-sm text-gray-500">{{ job()?.publicationDate | timeAgo }}</p>
</div>
