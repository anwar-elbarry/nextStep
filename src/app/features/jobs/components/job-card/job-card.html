<div class="bg-white rounded-xl shadow-md hover:shadow-lg transition-all duration-300 overflow-hidden border border-gray-200 max-w-72 hover:border-gray-400">
  <!-- Card Header -->
  <div class="bg-blue-950 px-5 py-4">
    <i class="fa-regular fa-heart text-white text-2xl"></i>
    <h3 class="text-lg font-medium text-white mb-1 line-clamp-1">{{ job()?.jobTitle }}</h3>
    <div class="flex items-center gap-2 text-gray-200">
      <!-- Building2 Icon -->
      <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>
        <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>
        <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/>
        <path d="M10 6h4"/>
        <path d="M10 10h4"/>
        <path d="M10 14h4"/>
        <path d="M10 18h4"/>
      </svg>
      <span class="text-sm font-medium">{{ job()?.companyName }}</span>
    </div>
  </div>

  <!-- Card Body -->
  <div class="p-4 space-y-3">
    <!-- Location & Date -->
    <div class="flex flex-col gap-2 text-xs">
      <div class="flex items-center gap-2 text-gray-600">
        <!-- MapPin Icon -->
        <svg class="w-4 h-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span>{{job()?.location}}</span>
      </div>
      <div class="flex items-center gap-2 text-gray-600">
        <!-- Calendar Icon -->
        <svg class="w-4 h-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
          <line x1="16" x2="16" y1="2" y2="6"/>
          <line x1="8" x2="8" y1="2" y2="6"/>
          <line x1="3" x2="21" y1="10" y2="10"/>
        </svg>
        <span>{{ job()?.publicationDate }}</span>
      </div>
    </div>

    <!-- Salary Badge -->
    <div class="inline-flex items-center gap-2 bg-gray-100 text-gray-700 px-3 py-1.5 rounded-md border border-gray-300 text-xs font-semibold">
      <!-- DollarSign Icon -->
      <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" x2="12" y1="2" y2="22"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
      <span>{{ job()?.salary }}</span>
    </div>

    <!-- Description -->
    <p class="text-gray-700 text-sm leading-relaxed line-clamp-3">
      {{ job()?.descriptionPreview }}
    </p>

    <!-- Call to Action Button -->
    <a (click)="getJobDetails(job()?.id || 'not-found')" class="inline-flex w-full items-center justify-center gap-2 text-white bg-blue-950 hover:bg-white hover:text-blue-950 hover:border-1 font-semibold py-2 px-4 rounded-lg text-sm transition-all duration-300 transform hover:translate-y-[-1px] hover:shadow-md mt-1">
      View Details
      <!-- ArrowRight Icon -->
      <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"/>
        <path d="m12 5 7 7-7 7"/>
      </svg>
    </a>
  </div>
</div>
