<div
  class="bg-white border border-gray-200 rounded-lg p-4 hover:border-orange-300 hover:shadow-md transition-all duration-200 relative">

  <!-- Bookmark Icon -->
  @if (isauthenticated()) {
  @if (isFavorite()) {
  <button (click)="removeFromFavorites(job()!); $event.stopPropagation()"
     class="absolute top-4 right-4 p-1.5 rounded-full hover:bg-gray-100 transition-all duration-200"
     aria-label="Remove from favorites">
          <i class="fas fa-heart" style="color: red;"></i>
  </button>
  } @else {
  <button (click)="addToFavorites(job()!); $event.stopPropagation()"
    class="absolute top-4 right-4 p-1.5 rounded-full hover:bg-gray-100 transition-all duration-200"
     aria-label="add to favorites">
          <i class="fas fa-heart" style="color: rgba(207, 206, 206, 0.545);"></i>
  </button>
  }
  }

  <!-- Content -->
  <div class="flex gap-3 pr-8">
    <!-- Company Logo Placeholder -->
    <div
      class="flex-shrink-0 w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">
      {{ job()?.companyName?.charAt(0) || 'C' }}
    </div>

    <!-- Job Info -->
    <div class="flex-1 min-w-0">
      <!-- Job Title -->
      <h3 class="text-base font-semibold text-gray-900 mb-1 truncate">
        {{ job()?.jobTitle }}
      </h3>

      <!-- Company & Location -->
      <p class="text-sm text-gray-600 mb-2">
        {{ job()?.companyName }} • {{ job()?.location }}
      </p>

      <!-- Footer -->
      <div class="flex items-center justify-between text-sm">
        <span class="text-gray-500">{{ job()?.publicationDate | timeAgo }}</span>
        <span class="font-semibold text-gray-900">$ {{ job()?.salary }}</span>
      </div>
    </div>
  </div>
</div>
