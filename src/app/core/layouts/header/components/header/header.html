<header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">

        <!-- Logo + Brand -->
        <div class="flex items-center">
          <a href="/" class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md">
              J
            </div>
            <span class="text-2xl font-bold text-gray-900 tracking-tight">
              JobFinder
            </span>
          </a>
        </div>

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center space-x-1">
          <!-- Main links -->
          <a routerLink="/jobs"
             class="px-4 py-2 text-gray-700 hover:text-blue-600 hover:bg-blue-50 rounded-lg font-medium transition-colors">
            Jobs
          </a>
          <a href="/favorites"
             class="px-4 py-2 text-gray-700 hover:text-blue-600 hover:bg-blue-50 rounded-lg font-medium transition-colors">
            Favorites
          </a>
          <a href="/applications"
             class="px-4 py-2 text-gray-700 hover:text-blue-600 hover:bg-blue-50 rounded-lg font-medium transition-colors">
            My Applications
          </a>
          <a href="/profile"
             class="px-4 py-2 text-gray-700 hover:text-blue-600 hover:bg-blue-50 rounded-lg font-medium transition-colors">
            Profile
          </a>
        </nav>

        <!-- Auth section (Desktop) -->
        <div class="hidden md:flex items-center space-x-4">

          <!-- Logged OUT state -->
          <div class="flex items-center space-x-3">
            <a routerLink="/login"
               class="px-4 py-2 text-gray-700 hover:text-blue-600 font-medium transition">
              Login
            </a>
            <a routerLink="/register"
               class="px-5 py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition shadow-sm">
              Register
            </a>
          </div>

          <!-- Logged IN state (uncomment when user is authenticated) -->
          <!--
          <div class="flex items-center space-x-4">
            <a href="/profile" class="flex items-center space-x-2 hover:text-blue-600 transition">
              <img src="https://ui-avatars.com/api/?name=John+Doe&background=0D8ABC&color=fff&size=128" 
                   alt="User" class="w-8 h-8 rounded-full object-cover border-2 border-white shadow-sm">
              <span class="font-medium text-gray-800">John</span>
            </a>
            <button class="text-gray-600 hover:text-red-600 transition">
              <i class="fas fa-sign-out-alt"></i>
            </button>
          </div>
          -->

        </div>

        <!-- Mobile menu button -->
        <button class="md:hidden text-gray-700 focus:outline-none">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

      </div>
    </div>

    <!-- Mobile menu (hidden by default - toggle with JS) -->
    <div class="hidden md:hidden bg-white border-t border-gray-200">
      <div class="px-4 py-5 space-y-3">
        <a href="/jobs" class="block px-3 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-md">Jobs</a>
        <a href="/favorites" class="block px-3 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-md">Favorites</a>
        <a href="/applications" class="block px-3 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-md">My Applications</a>
        <a href="/profile" class="block px-3 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-md">Profile</a>
        
        <div class="pt-4 border-t border-gray-200">
          <a href="/login" class="block px-3 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-md">Login</a>
          <a href="/register" class="mt-2 block px-3 py-2.5 bg-blue-600 text-white text-center rounded-lg hover:bg-blue-700">Register</a>
        </div>
      </div>
    </div>
  </header>
