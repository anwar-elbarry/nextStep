<nav class="bg-white shadow-md border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">

      <div class="flex items-center space-x-8">
        <a routerLink="/jobs" class="text-2xl font-bold text-blue-600 tracking-tight">
          JobFinder
        </a>

        <div class="hidden md:flex space-x-4">
          <a routerLink="/jobs"
             routerLinkActive="text-blue-600 border-b-2 border-blue-600"
             class="text-gray-600 hover:text-blue-500 px-3 py-2 font-medium transition">
            Rechercher
          </a>

          @if (currentUser() !== null) {
            <a routerLink="/favorites"
               routerLinkActive="text-blue-600 border-b-2 border-blue-600"
               class="text-gray-600 hover:text-blue-500 px-3 py-2 font-medium transition">
              Mes Favoris
            </a>
            <a routerLink="/applications"
               routerLinkActive="text-blue-600 border-b-2 border-blue-600"
               class="text-gray-600 hover:text-blue-500 px-3 py-2 font-medium transition">
              Candidatures
            </a>
          }
        </div>
      </div>

      <div class="flex items-center space-x-4">

        @if (currentUser() == null) {
          <a routerLink="/login" class="text-gray-600 hover:text-blue-600 font-medium">
            Connexion
          </a>
          <a routerLink="/register" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition">
            S'inscrire
          </a>
        } @else {
          <div class="flex items-center space-x-3 border-l pl-4">
            <span class="text-gray-700 font-semibold">
              {{ currentUser()?.firstName }} {{ currentUser()?.lastName }}
            </span>
            <button (click)="logout()"
                    class="text-sm bg-red-50 text-red-600 px-3 py-1.5 rounded-md hover:bg-red-100 transition font-medium">
              Déconnexion
            </button>
          </div>
        }

      </div>
    </div>
  </div>
</nav>
